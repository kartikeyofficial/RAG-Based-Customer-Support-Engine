<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-app">
    <div class="header">
        <div class="logo">S</div>
        <div>
            <h1>ShopSphere Customer Support</h1>
            <p><span class="status-dot"></span>AI assistant grounded in company policies</p>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message assistant">Hi! I can help with returns, exchanges, shipping, payments, refunds and orders. What would you like to know?</div>
    </div>

    <div class="quick-questions">
        <button onclick="askQuick('Can I return a product after 20 days?')">Return after 20 days?</button>
        <button onclick="askQuick('How long does a refund take?')">Refund time?</button>
        <button onclick="askQuick('Can I exchange a different size?')">Exchange size?</button>
        <button onclick="askQuick('How long is standard delivery?')">Delivery time?</button>
    </div>

    <form class="composer" id="chatForm">
        <input id="question" placeholder="Ask about your order or our policies..." autocomplete="off" required>
        <button id="sendButton" type="submit">Send</button>
    </form>
</div>
<script src="script.js"></script>


   
</script>
</body>
</html>
